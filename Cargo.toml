[package]
name = "template-dtnpm-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Template GitHub pour créer une application ou un service autonome DTN BPv7 (dtnpm)"
repository = "https://github.com/dtn-postmaster/template-dtnpm-app"
keywords = ["dtn", "bpv7", "hardy", "dtnpm", "template"]

[lib]
name = "template_dtnpm_app"
path = "src/lib.rs"

[[bin]]
name = "template-dtnpm-app"
path = "src/main.rs"

[dependencies]
dtnpm-core = { path = "../dtnpm-core" }
hardy-async = { path = "../../hardy/async" }
hardy-bpa = { path = "../../hardy/bpa", default-features = false, features = ["serde", "rfc9173", "tokio"] }
hardy-bpv7 = { path = "../../hardy/bpv7", features = ["std", "serde", "rfc9173"] }
hardy-proto = { path = "../../hardy/proto", features = ["serde"] }

anyhow = "1.0"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43", features = ["full"] }
